name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Non-blocking until pnpm migrates off the retired npm audit endpoint
      # (registry returns 410 for every `pnpm audit` call — pnpm/pnpm#11265).
      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm pack:check
