name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Non-blocking until pnpm migrates off the retired npm audit endpoint
      # (registry returns 410 for every `pnpm audit` call — pnpm/pnpm#11265).
      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Publish @relay-cache/core
        run: pnpm --filter @relay-cache/core publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @relay-cache/cli
        run: pnpm --filter @relay-cache/cli publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
